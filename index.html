<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZT — сайт и кабинет родственника</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; min-height: 100vh; margin: 0;
    background: #fbfbfc; color: #1a1a1a; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e8e8ea; }
    .card { background: #1e2127; border-color: #32363f; }
    .muted { color: #9aa0ab; }
  }
  .card {
    max-width: 480px; padding: 32px 36px; border-radius: 12px;
    background: #fff; border: 1px solid #e3e5e9; text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .muted { color: #6b7280; font-size: 15px; line-height: 1.5; margin: 0; }
  .tag {
    display: inline-block; margin-top: 18px; padding: 5px 12px;
    border-radius: 99px; background: #f0f2f5; color: #6b7280;
    font-size: 13px; letter-spacing: 0.02em;
  }
  @media (prefers-color-scheme: dark) { .tag { background: #2a2e36; color: #9aa0ab; } }
</style>
</head>
<body>
  <div class="card">
    <h1>ZT — сайт и кабинет родственника</h1>
    <p class="muted">Новый сайт zt.ru и личный кабинет родственника: написать, поговорить, помочь деньгами, порадовать близкого</p>
    <span class="tag">В работе</span>
  </div>
</body>
</html>
