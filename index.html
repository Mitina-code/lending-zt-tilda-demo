<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>ZT Рядом — связь с близким</title>
<link rel="icon" href="https://cdn.zt.ru/images/logos/ZT.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Мобильный сайт zt.ru и кабинет lk.zt.ru так, как их видит родственник в браузере телефона.
   На широком экране — та же колонка по центру. Светлая тема — фирменный стиль ZT. */
:root{
  --purple:#683DCC;--purple-d:#5E32BE;--purple-l:#EEE5FF;
  --green:#00BF7F;--green-d:#05A660;--green-l:#E3FFF1;
  --orange-d:#B35F00;--orange-l:#FFF8E5;
  --red:#E53535;--red-l:#FFE5E5;--blue-l:#E5F0FF;
  --ink:#1C1C28;--text:#28293D;--muted:#555770;--faint:#8F90A6;--line:#E4E4EB;--line2:#EBEBF0;
  --bg:#F2F2F5;--card:#FFFFFF;--soft:#FAFAFC;
  --font:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple);text-decoration:none}
:focus-visible{outline:3px solid #8E6ED9;outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.page.white{background:var(--card)}
.page.tabbed{padding-bottom:calc(84px + var(--sb))}

/* шапки */
.hdr{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line2)}
.hdr .logo{display:block;height:22px;width:auto}
.hdr .title{flex:1;min-width:0;font-weight:600;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr.back{padding-left:4px}
.sp{flex:1}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.ib:active{background:var(--bg)}
.ib svg{width:24px;height:24px}

/* нижнее меню */
.tabbar{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:var(--sb)}
.tabbar a{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);position:relative}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--purple)}
.tabbar .dot{position:absolute;top:10px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* общие элементы */
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.wrap.loose{padding:20px 16px;gap:16px}
.card{background:var(--card);border-radius:20px;padding:16px}
.card.flat{background:var(--soft);border:1px solid var(--line2)}
.h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.h2{margin:0;font-size:22px;line-height:1.25;font-weight:700;color:var(--ink);text-wrap:balance}
.h3{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
.sec{font-size:15px;font-weight:700;color:var(--ink);margin:8px 4px 0}
.muted{color:var(--muted)}.faint{color:var(--faint);font-size:14px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{min-height:54px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--purple);color:#fff;font-size:17px;font-weight:600;padding:0 20px;text-align:center}
.btn:active{background:var(--purple-d)}
.btn[disabled]{background:#C7C9D9;color:#fff}
.btn.sm{min-height:44px;width:auto;font-size:15px;border-radius:12px;padding:0 16px}
.btn.soft{background:var(--purple-l);color:var(--purple-d)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid #C7C9D9}
.btn.white{background:#fff;color:var(--ink)}
.btn.dark{background:var(--ink)}
.link{background:none;border:0;color:var(--purple);font-weight:600;padding:10px 0;font-size:16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.avatar.sm{width:40px;height:40px;font-size:14px}
.avatar.soft{background:var(--purple-l);color:var(--purple-d)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap}
.s-ok{background:var(--green-l);color:var(--green-d)}.s-wait{background:var(--orange-l);color:var(--orange-d)}.s-new{background:var(--purple-l);color:var(--purple-d)}.s-err{background:var(--red-l);color:var(--red)}
.chev,.item > svg:last-child{color:#C7C9D9;flex-shrink:0;width:20px;height:20px}
.item{min-height:64px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:0;border-radius:16px;text-align:left;color:var(--text)}
.item:active{background:var(--soft)}
.item b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.item small{display:block;color:var(--faint);font-size:14px;margin-top:1px}
.item.bordered{border:1px solid var(--line)}
.list{background:var(--card);border-radius:20px;overflow:hidden}
.list > .item{border-radius:0;border-bottom:1px solid var(--bg)}
.list > .item:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:20px;height:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{min-height:116px;padding:16px;border-radius:20px;background:var(--card);border:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--ink)}
.act:active{transform:scale(.98)}
.act svg{width:28px;height:28px;color:var(--purple)}
.act b{display:block;font-size:17px;font-weight:600}
.act span{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.act.main{background:var(--purple);color:#fff}.act.main svg{color:#fff}.act.main span{color:#D9CCF7}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;color:var(--muted)}
.inp{width:100%;min-height:56px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:18px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--purple);background:#fff}
textarea.inp{min-height:180px;resize:none;font-size:17px;line-height:1.5}
.code{letter-spacing:.6em;text-align:center;font-size:28px;font-weight:600;padding-left:.6em}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choices button{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:600;color:var(--ink)}
.choices button.on{border:2px solid var(--purple);background:var(--purple-l);color:var(--purple-d)}
.sw{position:relative;width:52px;height:32px;flex-shrink:0}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:#C7C9D9;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked + i{background:var(--purple)}
.sw input:checked + i::after{transform:translateX(20px)}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0}
.opt + .opt{border-top:1px solid var(--bg)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum b{font-size:22px;color:var(--ink)}
.stick{position:sticky;bottom:0;background:linear-gradient(to top,var(--card) 80%,rgba(255,255,255,0));padding:16px 16px calc(16px + var(--sb));display:flex;flex-direction:column;gap:10px;margin-top:auto}
.stick.grey{background:linear-gradient(to top,var(--bg) 80%,rgba(242,242,245,0))}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(28,28,40,.7);color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.addph{width:76px;height:76px;border-radius:12px;border:1.5px dashed #C7C9D9;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--purple);font-size:12px;font-weight:600}
.addph svg{width:24px;height:24px}
.extra{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--green-l);color:var(--green-d);font-weight:600;font-size:14px}
.extra button{margin-left:auto;border:0;background:none;color:var(--green-d);font-size:18px;width:32px;height:32px}
.tl{display:flex;flex-direction:column}
.ts{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.ts:last-child{padding-bottom:0}
.ts::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.ts:last-child::before{display:none}
.ts .c{width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.ts .c svg{width:16px;height:16px}
.ts.done .c{background:var(--green-d);border-color:var(--green-d);color:#fff}.ts.done::before{background:var(--green-d)}
.ts.cur .c{border-color:var(--orange-d);background:var(--orange-l)}
.ts.cur .c::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange-d)}
.ts b{display:block;color:var(--ink);font-weight:600}
.ts.todo b{color:var(--faint);font-weight:500}
.paper{background:#FFFDF7;border:1px solid #F0E9D8;border-radius:16px;padding:18px;white-space:pre-line;color:var(--ink);font-size:17px;line-height:1.55}
.bubble{background:var(--purple-l);border-radius:16px;padding:14px 16px;white-space:pre-line;color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px;margin:0 -16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;white-space:nowrap}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.op{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--bg)}
.op:last-child{border-bottom:0}
.op b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.op .amt{font-weight:600;color:var(--ink);white-space:nowrap}
.op .amt.plus{color:var(--green-d)}
.day{font-size:13px;font-weight:600;color:var(--faint);padding:14px 16px 4px;text-transform:uppercase;letter-spacing:.04em}
.balance{background:var(--purple);color:#fff;border-radius:20px;padding:18px}
.balance .v{font-size:32px;font-weight:700;line-height:1.1;margin:4px 0 14px}
.balance small{color:#D9CCF7;font-size:14px}
.promo{background:var(--ink);color:#fff;border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px}
.promo svg{width:28px;height:28px;color:var(--green);flex-shrink:0}
.statusline{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:0;width:100%;text-align:left;font-size:15px;font-weight:500}
.center{text-align:center;align-items:center}
.done-ic{width:88px;height:88px;border-radius:50%;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center}
.done-ic svg{width:44px;height:44px}
.stores{display:flex;flex-direction:column;gap:10px}
.tile{min-height:132px;border-radius:20px;padding:16px;border:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--ink)}
.tile b{font-size:17px;font-weight:600}
.tile span{font-size:14px;color:var(--muted)}
.tile .em{font-size:30px;line-height:1}

/* сайт */
.hero{padding:28px 20px 28px;background:linear-gradient(180deg,#F6F1FF 0%,#FFFFFF 100%);display:flex;flex-direction:column;gap:16px}
.eyebrow{color:var(--purple);font-weight:600;font-size:15px}
.band{padding:28px 20px;display:flex;flex-direction:column;gap:12px}
.band.grey{background:var(--bg)}
.step{display:flex;gap:14px;align-items:flex-start}
.num{width:34px;height:34px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
details{background:var(--card);border-radius:16px;border:1px solid var(--line2)}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;font-weight:600;color:var(--ink);min-height:56px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--purple);border-bottom:2px solid var(--purple);transform:rotate(45deg);margin-top:-4px;flex-shrink:0;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details p{margin:0;padding:0 16px 16px;color:var(--muted)}
.foot{padding:24px 20px calc(28px + var(--sb));background:var(--ink);color:#A9ABBD;font-size:14px;display:flex;flex-direction:column;gap:10px}
.foot a{color:#fff}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bul li{display:flex;gap:10px}
.bul li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--purple);margin-top:8px;flex-shrink:0}

/* лендинг: прогрев холодного посетителя */
.land em{font-style:italic;color:var(--purple)}
.eyebrow2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.eyebrow2.light{color:#B9A3F0}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,191,127,.5)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(0,191,127,0)}100%{box-shadow:0 0 0 0 rgba(0,191,127,0)}}}
.hero2{padding:28px 20px 0;background:radial-gradient(120% 70% at 100% 100%,#E6DBFF 0%,rgba(230,219,255,0) 60%),radial-gradient(90% 50% at 0% 100%,#D8F7EA 0%,rgba(216,247,234,0) 60%),#FBFAFF;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.big{margin:0;font-size:40px;line-height:1.08;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.big em{color:var(--purple)}
.lead2{margin:0;font-size:18px;line-height:1.5;color:var(--muted)}
.hero-ctas{display:flex;flex-direction:column;gap:10px}
.hero-ctas .btn{box-shadow:0 10px 24px rgba(104,61,204,.28)}
.hero-ctas .btn.line{box-shadow:none;background:transparent}
.stage-phone{position:relative;height:330px;margin-top:6px}
.mock{position:absolute;left:50%;transform:translateX(-50%);top:0;width:250px;height:420px;border-radius:38px;background:#1C1C28;padding:10px;box-shadow:0 30px 60px rgba(40,20,90,.28)}
.mock-scr{width:100%;height:100%;border-radius:30px;background:var(--bg);padding:26px 12px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;font-size:12px}
.m-top{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px}
.m-top b{display:block;color:var(--ink);font-size:13px}
.m-top small{color:var(--faint);font-size:10px}
.m-av{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.m-st{border-radius:10px;padding:7px 9px;font-weight:600;font-size:11px}
.m-st.ok{background:var(--green-l);color:var(--green-d)}
.m-paper{background:#FFFDF7;border:1px solid #F0E9D8;border-radius:12px;padding:9px;color:var(--ink);line-height:1.4}
.m-paper small{display:block;color:var(--purple-d);font-weight:600;font-size:10px;margin-bottom:3px}
.m-photo{display:flex;gap:6px}
.m-photo span{flex:1;height:54px;border-radius:10px;background:linear-gradient(135deg,#9BD8B8,#5FB38A)}
.m-photo span+span{background:linear-gradient(135deg,#F7C98B,#E6955A)}
.m-btn{margin-top:auto;background:var(--purple);color:#fff;border-radius:10px;text-align:center;padding:9px;font-weight:600}
.float{position:absolute;background:#fff;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 10px 30px rgba(28,28,40,.14);display:flex;align-items:center;gap:8px;white-space:nowrap}
.fdot{width:8px;height:8px;border-radius:50%}
.f1{top:250px;left:0}
.f2{top:96px;right:0}
@media (prefers-reduced-motion:no-preference){.float{animation:bob 4s ease-in-out infinite}.f2{animation-delay:-2s}@keyframes bob{50%{transform:translateY(-8px)}}}
.dark2{background:linear-gradient(160deg,#2B1B5C 0%,#1C1C28 100%);color:#fff;padding:44px 20px;display:flex;flex-direction:column;gap:18px}
.big2{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.big2.ink{color:var(--ink)}
.dark2 .big2 em{color:#7CF0C3}
.pains{display:flex;flex-direction:column;gap:10px}
.pain{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:18px;padding:16px}
.pain b{display:block;font-size:17px;margin-bottom:4px}
.pain span{color:#C9C3E0;font-size:15px}
.after{margin:4px 0 0;font-size:17px;line-height:1.5;color:#fff}
.band2{scroll-margin-top:60px;padding:44px 20px;display:flex;flex-direction:column;gap:14px}
.band2.soft2{background:var(--bg)}
.feats{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.feat{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:16px}
.fic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fic svg{width:26px;height:26px}
.feat b{display:block;font-size:18px;color:var(--ink);margin-bottom:2px}
.feat span{color:var(--muted);font-size:15px}
.tlcard{padding:20px;margin-top:4px}
.prices{background:var(--card);border:1px solid var(--line2);border-radius:20px;overflow:hidden}
.price{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bg)}
.price:last-child{border-bottom:0}
.price b{display:block;color:var(--ink);font-weight:600}
.price small{color:var(--faint);font-size:14px}
.price > span{font-size:20px;font-weight:700;color:var(--purple)}
.trust{display:flex;flex-direction:column;gap:18px}
.trust > div{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:14px}
.trust > div > span{grid-row:span 2;width:44px;height:44px;border-radius:14px;background:rgba(124,240,195,.14);color:#7CF0C3;display:flex;align-items:center;justify-content:center}
.trust svg{width:22px;height:22px}
.trust b{font-size:17px}
.trust small{color:#C9C3E0;font-size:15px;line-height:1.45}
.final{padding:48px 20px;background:linear-gradient(160deg,#7B4FE0 0%,#5E32BE 100%);color:#fff;display:flex;flex-direction:column;gap:14px;text-align:center}
.final em{color:#B8FFE2}
.final p{margin:0 0 6px;font-size:18px;color:#E6DCFF}
.btn.ghostw{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff}
.stickycta{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(12px + var(--sb));background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line2)}
.reveal{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .js .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  .js .reveal.in{opacity:1;transform:none}
  .js .tlcard .ts{opacity:.25;transition:opacity .4s ease var(--d)}
  .js .in .tlcard .ts{opacity:1}
}
@media (min-width:420px){.big{font-size:44px}}

/* всплывающее окно снизу */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(28,28,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + var(--sb));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sb));width:calc(100% - 32px);max-width:448px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* экосреда: доступ к терминалу, голос и видео, заявки */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px}
.badge svg{width:16px;height:16px}
.act.locked{background:var(--soft);border:1px dashed #C7C9D9}
.act.locked svg{color:var(--faint)}
.act .lock{position:absolute;top:12px;right:12px;width:18px;height:18px;color:var(--faint)}
.act{position:relative}
.seg2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--bg);padding:4px;border-radius:14px}
.seg2 a{min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-size:15px;font-weight:600;color:var(--muted)}
.seg2 a.on{background:#fff;color:var(--purple);box-shadow:0 1px 3px rgba(28,28,40,.1)}
.seg2 a svg{width:18px;height:18px}
.seg2 a.off{color:#B4B6C8}
.rec{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px;border-radius:20px;background:var(--soft);border:1px solid var(--line2)}
.recbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(104,61,204,.3)}
.recbtn svg{width:40px;height:40px}
.recbtn.on{background:var(--red);box-shadow:0 0 0 0 rgba(229,53,53,.5)}
@media (prefers-reduced-motion:no-preference){.recbtn.on{animation:rp 1.4s infinite}@keyframes rp{70%{box-shadow:0 0 0 18px rgba(229,53,53,0)}100%{box-shadow:0 0 0 0 rgba(229,53,53,0)}}}
.timer{font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--purple);width:0}
audio,video{width:100%;border-radius:14px;background:#000}
audio{background:transparent}
.media{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--purple-l)}
.media .play{width:44px;height:44px;border-radius:50%;border:0;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.media .play svg{width:20px;height:20px}
.wave{flex:1;height:28px;background:repeating-linear-gradient(90deg,var(--purple-m,#8E6ED9) 0 3px,transparent 3px 6px);-webkit-mask:linear-gradient(90deg,#000 0,#000 100%);opacity:.5;border-radius:4px}
.vthumb{height:180px;border-radius:16px;background:linear-gradient(135deg,#3A2A6E,#1C1C28);display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.vthumb .play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.vthumb .play svg{width:28px;height:28px}
.vthumb small{position:absolute;right:12px;bottom:10px;font-size:13px;color:#fff;opacity:.8}
.info{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--blue-l);color:#1B3A6B;font-size:15px}
.info svg{width:22px;height:22px;flex-shrink:0;color:#0052CC}
.info.warn{background:var(--orange-l);color:#5C3A00}.info.warn svg{color:var(--orange-d)}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:64px;min-height:72px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dates button small{font-size:12px;color:var(--faint);text-transform:uppercase}
.dates button b{font-size:20px;color:var(--ink)}
.dates button.on{border:2px solid var(--purple);background:var(--purple-l)}
.dates button[disabled]{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slots button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600}
.slots button.on{border:2px solid var(--purple);background:var(--purple-l);color:var(--purple-d)}
.slots button[disabled]{opacity:.35;text-decoration:line-through}
.kind{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left}
.kind.on{border:2px solid var(--purple);background:var(--purple-l)}
.kind.off{opacity:.55}
.kind b{display:block;color:var(--ink);font-size:16px}
.kind small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.kind .r{margin-left:auto;font-weight:600;color:var(--ink);white-space:nowrap}
.demo{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--soft);border:1px dashed #C7C9D9}
.demo > b{font-size:13px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--purple-l);border-top-color:var(--purple)}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.eco{display:flex;flex-direction:column;gap:12px}
.eco-g{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eco-g .hd{display:flex;align-items:center;gap:12px}
.eco-g .hd b{font-size:18px;color:var(--ink)}
.eco-g .hd small{display:block;font-size:13px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:14px;padding:6px 10px;border-radius:10px;background:var(--bg);color:var(--text)}
.tags span.vt{background:var(--purple-l);color:var(--purple-d)}
.foot-note{font-size:13px;color:var(--faint)}

/* ===== ZT Рядом: переписка как мессенджер ===== */
.brand{display:flex;align-items:center;gap:8px}
.brand span{font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
.brand span em{font-style:normal;color:var(--purple)}
.chat-page{min-height:100vh;min-height:100dvh;background:#EFEAF8;background-image:radial-gradient(rgba(104,61,204,.06) 1px,transparent 1px);background-size:18px 18px;display:flex;flex-direction:column}
.chat-hdr{position:sticky;top:0;z-index:20;height:62px;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.chat-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:4px;border-radius:12px}
.chat-who .avatar{width:40px;height:40px;font-size:14px}
.chat-who b{display:block;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-who small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-who small i{font-style:normal;color:var(--purple)}
.hbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--purple);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.hbtn svg{width:24px;height:24px}
.hbtn.off{color:#B4B6C8}
.hbtn .lk{position:absolute;right:6px;bottom:6px;width:14px;height:14px;background:#fff;border-radius:50%;color:var(--faint)}
.hbtn .lk svg{width:14px;height:14px}
.msgs{flex:1;padding:12px 10px calc(150px + var(--sb));display:flex;flex-direction:column;gap:4px}
.dsep{align-self:center;margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:10px}
.b{max-width:84%;padding:8px 11px 6px;border-radius:18px;position:relative;font-size:16px;line-height:1.4;color:var(--ink);background:#fff;align-self:flex-start;border:0;text-align:left;box-shadow:0 1px 1px rgba(28,28,40,.06);margin-top:2px}
.b.me{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:6px}
.b.him{border-bottom-left-radius:6px}
.b .tx{white-space:pre-wrap;word-wrap:break-word}
.b .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap}
.b.me .meta{color:#D9CCF7}
.b .meta svg{width:16px;height:16px}
.b .meta .rd{color:#7CF0C3}
.b .lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--purple-d);margin-bottom:4px}
.b .lab svg{width:14px;height:14px}
.b.me .lab{color:#E6DCFF}
.redact{background:#1C1C28;color:transparent;border-radius:3px;user-select:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.b.me .redact{background:#2B1B5C}
.rnote{font-size:12px;color:var(--orange-d);margin-top:4px;display:flex;gap:4px;align-items:center}
.b.me .rnote{color:#FFD9A0}
.rnote svg{width:14px;height:14px}
.scanthumb{display:block;width:100%;height:92px;border-radius:12px;margin:2px 0 6px;background:#FFFDF7 repeating-linear-gradient(transparent 0 15px,#E7E0CC 15px 16px);border:1px solid #EFE6CF;position:relative;overflow:hidden}
.scanthumb::before{content:attr(data-t);position:absolute;inset:8px 10px;font-family:'Caveat',cursive;font-size:17px;line-height:16px;color:#2B3A67;opacity:.9;overflow:hidden}
.scanthumb .bar{position:absolute;left:24%;top:40px;width:52%;height:14px;background:#111;border-radius:2px;transform:rotate(-1deg)}
.scanthumb small{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(28,28,40,.7);color:#fff;padding:2px 6px;border-radius:6px}
.b.rej{background:var(--red-l);color:var(--ink)}
.b.rej .meta{color:var(--red)}
.vbub{display:flex;align-items:center;gap:10px;min-width:220px}
.vbub .pl{width:40px;height:40px;border-radius:50%;border:0;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b.me .vbub .pl{background:#fff;color:var(--purple)}
.vbub .pl svg{width:18px;height:18px}
.vbub .wv{flex:1;height:26px;background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px);opacity:.35;border-radius:3px;-webkit-mask:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
.vbub audio{max-width:220px;height:40px}
.circle{width:200px;height:200px;border-radius:50%;overflow:hidden;position:relative;background:linear-gradient(135deg,#3A2A6E,#1C1C28);display:flex;align-items:center;justify-content:center;color:#fff;border:0}
.circle video{width:100%;height:100%;object-fit:cover;border-radius:0}
.circle .pl{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.circle .pl svg{width:26px;height:26px}
.b.round{background:transparent;box-shadow:none;padding:0}
.b.round .meta{background:rgba(28,28,40,.55);color:#fff;border-radius:10px;padding:2px 8px;align-self:flex-end;width:max-content;margin:4px 0 0 auto}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin:-2px -5px 6px;border-radius:14px;overflow:hidden}
.photos img,.photos span{width:100%;height:110px;object-fit:cover;display:block;background:linear-gradient(135deg,#9BD8B8,#5FB38A)}
.photos span:nth-child(2n){background:linear-gradient(135deg,#F7C98B,#E6955A)}
.ev{align-self:center;max-width:90%;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);background:rgba(255,255,255,.92);padding:7px 12px;border-radius:14px;margin:6px 0;border:0;text-align:left}
.ev svg{width:16px;height:16px;color:var(--purple);flex-shrink:0}
.ev small{color:var(--faint)}
.ev.green svg{color:var(--green-d)}
.typing{align-self:flex-start;font-size:13px;color:var(--muted);background:rgba(255,255,255,.85);padding:6px 12px;border-radius:12px;margin-top:6px}
.composer{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line2);padding:8px 8px calc(8px + var(--sb))}
.crow{display:flex;align-items:flex-end;gap:6px}
.cbtn{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.cbtn svg{width:26px;height:26px}
.cbtn.send{background:var(--purple);color:#fff}
.cbtn.send svg{width:22px;height:22px}
.cbtn.lockd{color:#B4B6C8}
.cbtn .lk{position:absolute;right:7px;bottom:7px;width:14px;height:14px;background:#fff;border-radius:50%;color:var(--faint)}
.cbtn .lk svg{width:14px;height:14px}
.cin{flex:1;min-height:46px;max-height:140px;resize:none;border:1px solid var(--line);background:var(--soft);border-radius:23px;padding:11px 16px;font-size:16px;line-height:1.4;color:var(--ink);outline:none}
.cin:focus{border-color:var(--purple);background:#fff}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 8px 8px}
.hint svg{width:16px;height:16px;color:var(--purple);flex-shrink:0}
.hint b{color:var(--ink);font-weight:600;margin-left:auto;white-space:nowrap}
.hint label{display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap}
.hint input{width:18px;height:18px;accent-color:var(--purple)}
.pstrip{display:flex;gap:6px;padding:0 6px 8px;overflow-x:auto}
.pstrip .thumb{width:60px;height:60px;flex-shrink:0}
.recrow{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 4px}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}}
.recrow .tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:44px}
.recrow .grow{color:var(--muted);font-size:14px}
.attach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.attach button,.attach label{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:13px;color:var(--ink);cursor:pointer;position:relative}
.attach .ci{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.attach .ci svg{width:26px;height:26px}
.attach .off{opacity:.45}
.chatlist .item{min-height:76px}
.chatlist .avatar{width:54px;height:54px}
.chatlist .tm{font-size:12px;color:var(--faint);align-self:flex-start;margin-top:4px}
.ubadge{min-width:22px;height:22px;border-radius:11px;background:var(--purple);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.relhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px 16px;background:#fff;text-align:center}
.relhead .avatar{width:88px;height:88px;font-size:30px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:8px}
.quick a,.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--bg);border:0;font-size:13px;font-weight:600;color:var(--purple-d);position:relative}
.quick svg{width:22px;height:22px}
.quick .off{color:#B4B6C8}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:14px;color:var(--muted)}
.legend svg{width:18px;height:18px}
.scanfull{background:#FFFDF7 repeating-linear-gradient(transparent 0 27px,#E7E0CC 27px 28px);border:1px solid #EFE6CF;border-radius:14px;padding:14px 18px;font-family:'Caveat',cursive;font-size:24px;line-height:28px;color:#2B3A67;white-space:pre-wrap;min-height:240px}
.scanfull .redact{background:#111}

/* ===== меню внизу всегда видно после входа ===== */
.withtabs .page{padding-bottom:calc(72px + var(--sb))}
.withtabs .stick{bottom:calc(64px + var(--sb));padding-bottom:14px}
.withtabs .composer{bottom:calc(64px + var(--sb));padding-bottom:8px;border-bottom:1px solid var(--line2)}
.withtabs .msgs{padding-bottom:calc(150px + 64px + var(--sb))}
.withtabs .chat-page{min-height:100vh}
.withtabs .toast{bottom:calc(150px + var(--sb))}
.card.flat .row.between > .muted{white-space:nowrap;flex-shrink:0}
.ptitle{padding:14px 20px 2px;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.01em}

/* ===== согласия близкого ===== */
.card.consent{display:flex;flex-direction:column;gap:8px}
.card.consent b{color:var(--ink);font-size:16px}
.card.consent ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.card.consent li{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}
.card.consent li svg{width:18px;height:18px;flex-shrink:0}
.card.consent li.y svg{color:var(--green-d)}
.card.consent li.n{color:var(--faint)}
.card.consent li.n svg{color:#C7C9D9}
.card.consent .consent-ch{font-size:14px;color:#8A5A00;background:#FFF8E1;border-radius:10px;padding:8px 10px}
.card.consent small{color:var(--faint);font-size:13px;line-height:1.4}

/* ===== связаться с близким законно ===== */
.paths{display:flex;flex-direction:column;gap:10px}
.pathc{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--text)}
.pathc.go{border-color:var(--purple)}
.pathc .pn{width:30px;height:30px;border-radius:50%;background:var(--purple-l);color:var(--purple-d);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pathc b{display:block;color:var(--ink);font-size:16px}
.pathc small{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px}
.pathc .link{padding:6px 0 0;font-size:15px}

function dayLabel(t){const d=new Date(t),n=new Date();const y=new Date();y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString())return 'Сегодня';if(d.toDateString()===y.toDateString())return 'Вчера';return fmt(d)}
function today(){return 'сегодня, '+hm(Date.now())}
const IRREG={'Павел':'Павл','Лев':'Льв','Пётр':'Петр'};
function decl(n,c){
  const last=n.slice(-1),stem=n.slice(0,-1);
  if(last==='й'||last==='ь') return stem+({d:'ю',g:'я',i:'ем'}[c]);
  if(last==='а') return stem+({d:'е',g:(/[гкхжшщч]$/.test(stem)?'и':'ы'),i:(/[жшщчц]$/.test(stem)?'ей':'ой')}[c]);
  if(last==='я') return stem+({d:(stem.slice(-1)==='и'?'и':'е'),g:'и',i:'ей'}[c]);
  const b=IRREG[n]||n; return b+({d:'у',g:'а',i:'ом'}[c]);
}

const SEC=1000, DEMO={checked:12*SEC,delivered:25*SEC,read:40*SEC,reply:60*SEC};   // ускоренная механика для показа

function feed(){
  const r=rel(), pn=Number(r.id.slice(1)), OT=outSet(me().role), now=Date.now();
  const items=[];
  FAM.переписка.filter(z=>z[2]===pn&&z[3]===S.me.ci).forEach(z=>{
    const out=z[4]===1, dec=z[6], dig=z[7]===1, h=hash('h'+z[0]);
    if(!out&&dec===2) return;   // его письма, которые не пропустили, родственнику не показываем
    const d=dAgo(z[1]); d.setHours(9+h%12,h%60);
    const m={kind:'msg',id:'h'+z[0],t:d.getTime(),out,ch:z[5],dec,route:dig?'terminal':'paper',dur:25+h%60,h};
    if(out){m.text=OT[h%OT.length].replace('{R}',r.first);m.status=dec===2?'rejected':(dig?'read':'handed');if(dec===2)m.reason=REJ[h%REJ.length]}
    else{const T=IN_T[h%IN_T.length];m.parts=T;m.text=T.join(' ')+'\n\n'+r.first;m.how=dig?'terminal':'paper';m.cut=dec===1?(h%2?'paper':'text'):null;m.status=(!S.read[m.id]&&z[1]<=8)?'new':'seen'}
    items.push(m);
  });
  S.sent.filter(x=>x.pid===r.id).forEach(x=>{
    const age=now-x.t, route=r.vt?'terminal':'paper';
    const st=age<DEMO.checked?'check':age<DEMO.delivered?'checked':route==='terminal'?(age<DEMO.read?'delivered':'read'):'handed';
    items.push(Object.assign({kind:'msg',out:true,route,status:st,dec:0},x));
    if(x.ch===0&&age>=DEMO.reply&&!x.noReply){
      const h=hash(x.id);
      items.push({kind:'msg',id:x.id+'r',t:x.t+DEMO.reply,out:false,ch:0,dec:0,how:r.vt?'terminal':'paper',route:r.vt?'terminal':'paper',parts:[REPLY_T[h%REPLY_T.length]],text:REPLY_T[h%REPLY_T.length]+'\n\n'+r.first,status:S.read[x.id+'r']?'seen':'new',h});
    }
  });
  // звонки: близкий звонит сам с карты для звонков — раз в 8–12 дней
  if(r.confirmed&&S.me.ci>=0){for(let d=3+hash(r.id)%5;d<FAM.окноДней;d+=8+hash(r.id+d)%5){const t=dAgo(d);t.setHours(18+d%3,10+d%40);items.push({kind:'ev',type:'call',t:t.getTime(),min:4+hash(r.id+'c'+d)%11})}}
  S.ops.filter(o=>o.pid===r.id&&o.ev).forEach(o=>items.push({kind:'ev',type:o.ev,t:o.t,o}));
  S.reqs.filter(q=>q.pid===r.id).forEach(q=>items.push({kind:'ev',type:'req',t:q.t,q}));
  streamEvents(r).forEach(e=>items.push(e));
  const pq=request();
  if(pq){const t=dAgo(pq.days);t.setHours(11,5);const txt=addressMe()+', если можно — подключи мне '+(FMT_ACC[pq.fmt]||'что-нибудь почитать')+'. Тут очень длинные дни.';items.push({kind:'msg',id:'plea',t:t.getTime(),out:false,ch:0,dec:0,how:'paper',route:'paper',parts:[txt],text:txt+'\n\n'+r.first,plea:true,status:S.read.plea?'seen':'new',h:1})}
  return items.sort((a,b)=>a.t-b.t);
}
function unreadCount(){if(!S.me)return 0;return feed().filter(m=>m.kind==='msg'&&!m.out&&m.status==='new').length}

/* ---------- сам чат ---------- */
function ticks(m){
  const s=m.status;
  if(s==='check') return `<span title="на проверке">${ic('clock')}</span>`;
  if(s==='checked') return `<span title="проверено">${ic('check')}</span>`;
  if(s==='delivered') return `<span title="доставлено на терминал">${ic('dcheck')}</span>`;
  if(s==='read') return `<span class="rd" title="прочитано на терминале">${ic('dcheck')}</span>`;
  if(s==='handed') return `<span class="rd" title="распечатано и вручено">${ic('print',2)}</span>`;
  return '';
}
function redactText(m){
  // вторая фраза закрыта; если вымарали на бумаге — то же в распознанном тексте
  if(!m.cut) return esc(m.text);
  // закрытый текст родственнику не передаётся: на его месте заглушка той же длины
  const p=m.parts; return esc(p[0])+' <span class="redact" role="img" aria-label="текст закрыт учреждением">'+p[1].replace(/\S/g,'▇')+'</span> '+esc(p.slice(2).join(' '))+'\n\n'+esc(rel().first);
}
function bubble(m){
  const r=rel(), cls=m.out?'me':'him', time=hm(m.t);
  if(m.status==='rejected') return `<div class="b me rej" role="button" tabindex="0" data-act="minfo" data-id="${m.id}"><div class="lab" style="color:var(--red)">${ic('info')}Не пропущено учреждением</div><div class="tx">${esc(m.text)}</div><div class="meta">деньги вернулись · ${time}</div></div>`;
  if(m.ch===2){
    const inner=m.url?`<video src="${m.url}" playsinline controls></video>`:`<span class="pl">${ic('play')}</span>`;
    return `<div class="b ${cls} round"><button class="circle" data-act="${m.url?'':'toast'}" data-msg="Воспроизведение (демо)">${inner}</button><button class="meta" data-act="minfo" data-id="${m.id}" style="border:0">0:${String(m.dur).padStart(2,'0')} · ${time} ${m.out?ticks(m):''}</button></div>`;
  }
  let body='';
  if(m.ch===1) body=`<div class="vbub">${m.url?`<audio controls src="${m.url}"></audio>`:`<span class="pl" data-act="toast" data-msg="Воспроизведение (демо)">${ic('play')}</span><span class="wv"></span>`}<span style="font-size:13px">0:${String(m.dur).padStart(2,'0')}</span></div>`;
  else {
    let lab='';
    if(!m.out&&m.how==='paper') lab=`<div class="lab">${ic('pen')}Написал от руки</div>`;
    else if(!m.out&&m.how==='terminal') lab=`<div class="lab">${ic('terminal')}С терминала</div>`;
    const ph=m.photos?`<div class="photos">${(m.photosData&&m.photosData.length?m.photosData.map(s=>`<img src="${s}" alt="">`):Array.from({length:m.photos},()=>'<span></span>')).join('')}</div>`:'';

function msgInfo(id){
  const r=rel(), m=feed().find(x=>x.id===id); if(!m) return;
  const T=(steps)=>`<div class="tl">${steps.map((s,i)=>`<div class="ts ${s[2]==='done'?'done':s[2]==='cur'?'cur':'todo'}"><div class="c">${s[2]==='done'?ic('check',3):''}</div><div><b>${s[0]}</b>${s[1]?`<span class="faint">${s[1]}</span>`:''}</div></div>`).join('')}</div>`;
  const when=t=>dayLabel(t)+', '+hm(t);
  let html='';
  if(m.out){
    const what=m.ch===1?'Голосовое':m.ch===2?'Видеосообщение':'Сообщение';
    if(m.status==='rejected') html=`<h2 class="h2">${what} не пропустили</h2><div class="info warn">${ic('info')}<span>${esc(m.reason)} Деньги вернулись на ваш счёт.</span></div>`;
    else{
      const s=m.status, order=['check','checked','delivered','read'];
      const st=m.route==='terminal'
        ? [['Отправлено',when(m.t),'done'],['Проверено учреждением',s==='check'?'обычно до 3 дней':'',s==='check'?'cur':'done'],['Доставлено на терминал','',order.indexOf(s)>=2?'done':s==='checked'?'cur':'todo'],[`Прочитано ${r.ins}`,'',s==='read'?'done':s==='delivered'?'cur':'todo']]
        : [['Отправлено',when(m.t),'done'],['Проверено учреждением',s==='check'?'обычно до 3 дней':'',s==='check'?'cur':'done'],['Распечатано цензором','',s==='handed'?'done':s==='checked'?'cur':'todo'],[`Вручено ${r.dat} лично`,'',s==='handed'?'done':'todo']];
      html=`<h2 class="h2">Путь сообщения</h2>${T(st)}<div class="info">${ic(m.route==='terminal'?'terminal':'print')}<span>${m.route==='terminal'?`У ${r.gen} в отряде есть видеотерминал — он читает там.`:`У ${r.gen} нет видеотерминала — сообщение распечатают и вручат на бумаге.`}</span></div>`;
    }
  } else {
    if(m.how==='paper'){
      html=`<h2 class="h2">Письмо от руки</h2>${T([[`${r.first} написал письмо`,'на бланке','done'],['Учреждение проверило',m.cut?'часть текста закрыта':'','done'],['Переведено в текст','','done'],['Пришло к вам в переписку',when(m.t),'done']])}`;
    } else html=`<h2 class="h2">С терминала</h2>${T([[`${r.first} написал на видеотерминале`,'','done'],['Учреждение проверило','','done'],['Пришло к вам',when(m.t),'done']])}`;
  }
  sheet(html+'<button class="btn line" data-act="closesheet">Закрыть</button>');
}

let REC={st:'idle',sec:0,url:null,timer:null,mr:null,stream:null};
function resetRec(){clearInterval(REC.timer);try{REC.mr&&REC.mr.state!=='inactive'&&(REC.mr.onstop=null,REC.mr.stop())}catch(e){}if(REC.stream)REC.stream.getTracks().forEach(t=>t.stop());REC={st:'idle',sec:0,url:null,timer:null,mr:null,stream:null}}
function startRec(){
  const tick=()=>{REC.sec++;const t=document.getElementById('rtime');if(t)t.textContent=Math.floor(REC.sec/60)+':'+String(REC.sec%60).padStart(2,'0');if(REC.sec>=90)stopRec()};
  const begin=()=>{REC.st='rec';REC.sec=0;rerender();REC.timer=setInterval(tick,1000)};
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      REC.stream=stream;const chunks=[];REC.mr=new MediaRecorder(stream);
      REC.mr.ondataavailable=e=>chunks.push(e.data);
      REC.mr.onstop=()=>{REC.url=URL.createObjectURL(new Blob(chunks,{type:REC.mr.mimeType||'audio/webm'}));stream.getTracks().forEach(t=>t.stop());REC.st='done';rerender()};
      REC.mr.start();begin();
    }).catch(()=>{toast('Микрофон недоступен — покажем запись без звука');begin()});
  } else begin();
}
function stopRec(){clearInterval(REC.timer);if(REC.mr&&REC.mr.state!=='inactive'){REC.mr.stop()}else{REC.st='done';rerender()}}

let keepScroll=false, liveT=null;
function route(){
  closeSheet(); clearTimeout(liveT);
  const full=(location.hash||'#/').slice(1)||'/', h=full.split('?')[0], q=full.split('?')[1]||'', parts=h.split('/').filter(Boolean);
  const needData=parts[0]==='lk'||parts[0]==='login'||parts[0]==='code';
  if(needData&&!FAM){document.getElementById('app').innerHTML=pgLoading();loadFam(route);return}
  if(S.me&&!S.auth) S.auth=true;   // сохранённые раньше входы
  if(S.me&&S.me.ci>=0&&!BY[S.me.pid]) S.me=null;
  if(parts[0]==='lk'&&!S.auth){S.next=h;save();location.replace('#/login');return}
  if(parts[0]==='lk'&&S.auth&&!S.me&&checkPending()){if(location.hash==='#/lk/home')route();else location.replace('#/lk/home');return}
  // без близкого открываются только знакомство, поиск, главная, поддержка и помощь
  if(parts[0]==='lk'&&!S.me&&!['start','find','home','support','profile','done'].includes(parts[1]||'')){location.replace('#/lk/start');return}
  if(!(parts[0]==='lk'&&parts[1]==='chat')&&REC.st!=='idle') resetRec();
  if(parts[1]==='card'&&+q) amt.card=+q;
  if(parts[1]==='transfer'&&+q) amt.transfer=+q;
  if(parts[1]==='visit'&&q==='video'&&!VS.type) VS={type:rel().vt?'video':null,date:null,slot:null};
  let html;
  if(!parts.length&&S.auth){location.replace('#/lk/home');return}
  if(!parts.length) html=pgLanding();
  else if(parts[0]==='stage') html=pgStage(parts[1]);
  else if(parts[0]==='app') html=pgApp();
  else if(parts[0]==='login'){if(S.auth){location.replace(S.me?'#/lk/home':'#/lk/start');return}html=pgLogin()}
  else if(parts[0]==='code') html=pgCode();
  else if(parts[0]==='lk'){
    const p=parts[1]||'';
    const M={start:pgStart,find:()=>parts[2]==='request'?pgFindReq():parts[2]==='where'?pgFindWhere():pgFind(),home:pgHomeMkt,stage:()=>pgStage(parts[2]).replace(backHdr(STAGES[parts[2]]?STAGES[parts[2]].t:'','/'),backHdr(STAGES[parts[2]]?STAGES[parts[2]].t:'','/lk/home')),stream:pgStream,'':pgChats,chat:pgChat,support:pgSupport,rel:pgRel,video:pgVideo,rules:pgRules,money:pgMoney,card:pgCard,transfer:pgTransfer,profile:pgProfile,help:pgHelp,joy:pgJoy,done:pgDone,visit:pgVisit,requests:pgRequests,place:pgPlace};
    html=p==='req'?pgReq(parts[2]):p==='apply'?pgApply(parts[2]):(M[p]||pgChats)();
  } else html=pgLanding();
  // после входа меню внизу видно всегда: на вложенных экранах подсвечен раздел, к которому они относятся
  const SECTION={home:'/lk/home',start:'/lk/home',find:'/lk/home',stage:'/lk/home','':'/lk',chat:'/lk',support:'/lk',rel:'/lk',video:'/lk',rules:'/lk',place:'/lk',joy:'/lk',stream:'/lk/stream',requests:'/lk/requests',req:'/lk/requests',visit:'/lk/requests',apply:'/lk/requests',profile:'/lk/profile',money:'/lk/profile',card:'/lk/profile',transfer:'/lk/profile',help:'/lk/profile',done:'/lk/home'};
  const withTabs=S.auth&&(parts[0]==='lk'||parts[0]==='stage'||parts[0]==='app');
  if(withTabs&&html.indexOf('class="tabbar"')<0) html+=tabbar(parts[0]==='lk'?(SECTION[parts[1]||'']||'/lk/home'):'/lk/home');
  document.body.classList.toggle('withtabs',!!withTabs);
  document.getElementById('app').innerHTML=html;
  document.title=parts[0]==='lk'?'ZT Рядом':'ZT Рядом — связь с близким';
  const isChat=parts[0]==='lk'&&(parts[1]==='chat'||parts[1]==='support');
  if(isChat&&!keepScroll){setTimeout(scrollBottom,0);setTimeout(scrollBottom,250)} else if(!keepScroll) window.scrollTo(0,0);
  keepScroll=false;
  const c=document.getElementById('code'); if(c) setTimeout(()=>c.focus(),200);
  autoGrow();
  initLanding();
  // демо: пока ждём согласия близкого — проверяем каждые 4 секунды
  if(S.auth&&!S.me&&S.pending&&S.pending.match&&parts[0]==='lk') liveT=setTimeout(route,4000);
  // пока сообщения «идут» — обновляем ленту, чтобы галочки менялись на глазах
  if(parts[1]==='chat'&&pendingDemo()&&REC.st==='idle') liveT=setTimeout(()=>{if(document.activeElement&&document.activeElement.id==='cin'){liveT=setTimeout(()=>route(),3000);return}const atBottom=window.innerHeight+window.scrollY>=document.body.scrollHeight-80;keepScroll=!atBottom;route();if(atBottom)setTimeout(scrollBottom,0)},3000);
}

function autoGrow(){const t=document.getElementById('cin')||document.getElementById('sin');if(t){t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight+2)+'px'}}

let io1,io2;
function initLanding(){
  if(io1)io1.disconnect(); if(io2)io2.disconnect();
  const rs=document.querySelectorAll('.reveal'); if(!rs.length) return;
  if(!('IntersectionObserver' in window)){rs.forEach(r=>r.classList.add('in'));return}
  io1=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io1.unobserve(e.target)}}),{threshold:.12});
  rs.forEach(r=>io1.observe(r));
  const hc=document.getElementById('herocta'),sc=document.getElementById('stickycta'),fin=document.querySelector('.final'),st={hero:true,fin:false};
  if(hc&&sc){io2=new IntersectionObserver(es=>{es.forEach(e=>{if(e.target===hc)st.hero=e.isIntersecting||e.boundingClientRect.top>0;else st.fin=e.isIntersecting||e.boundingClientRect.top<0});sc.hidden=st.hero||st.fin});io2.observe(hc);if(fin)io2.observe(fin)}
}

  else if(a==='sendvoice'){sendVoice()}
  else if(a==='sendvideo'){sendVideo()}
  else if(a==='supsend'){const i=document.getElementById('sin');const v=(i.value||'').trim();if(!v)return;S.support.push({out:true,text:v,t:Date.now()});save();rerender();setTimeout(()=>{S.support.push({out:false,text:'Спасибо! Оператор уже смотрит ваш вопрос и ответит здесь в течение 5 минут.',t:Date.now()});save();if(location.hash.indexOf('/lk/support')>=0){rerender();setTimeout(scrollBottom,30)}},1500);setTimeout(scrollBottom,30)}
  else if(a==='amt'){amt[t.parentNode.dataset.key]=+t.dataset.v;rerender()}
  else if(a==='pay'){const w=t.dataset.what;confirmPay(w,rub(w==='transfer'?amt.transfer+Math.round(amt.transfer*COMMISSION):amt[w]))}
  else if(a==='rmph'){DRAFT.photos.splice(+t.dataset.i,1);rerender()}
  else if(a==='hf'){hf=t.dataset.f;rerender()}
  else if(a==='vtype'){VS={type:t.dataset.k,date:null,slot:null};rerender()}
  else if(a==='vdate'){VS.date=t.dataset.d;VS.slot=null;rerender()}
  else if(a==='vslot'){VS.slot=t.dataset.s;rerender()}
  else if(a==='bookvisit'){bookVisit()}
  else if(a==='sendapply'){sendApply(t.dataset.type)}
  else if(a==='joy'){const j=JOY[+t.dataset.i];if(j[5]==='photo'){go('/lk/chat');setTimeout(attachSheet,200);return}DRAFT.text=(DRAFT.text?DRAFT.text+'\n':'')+'['+j[1]+' — '+j[3]+' ₽]';toast(j[1]+' — добавлено к сообщению');go('/lk/chat')}
  else if(a==='logout'){resetRec();try{localStorage.removeItem(KEY)}catch(x){}S=fresh();DRAFT={text:'',photos:[]};go('/login')}
});
function refreshComposer(){
  const r=rel(), has=DRAFT.text.trim()||DRAFT.photos.length;
  const h=document.getElementById('hint'); if(h) h.innerHTML=composerHint();
  const c=document.getElementById('cact'); if(c) c.innerHTML=has?`<button class="cbtn send" data-act="sendtext" aria-label="Отправить">${ic('send')}</button>`:(r.vt?`<button class="cbtn" data-act="recstart" aria-label="Записать голосовое">${ic('mic')}</button>`:`<button class="cbtn lockd" data-act="whyvt" aria-label="Голосовые недоступны">${ic('mic')}<span class="lk">${ic('lock')}</span></button>`);
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ph'){const f=formatPhone(t.value);t.value=f;S.phone=f;const b=document.getElementById('getcode');if(b)b.disabled=digits(f).length<11}
  if(t.id==='code'){t.value=digits(t.value);if(t.value.length===4){t.blur();setTimeout(login,250)}}
  if(t.id==='pc'){t.value=digits(t.value);if(t.value.length===4){t.blur();setTimeout(doPay,250)}}
  if(t.id==='cin'){DRAFT.text=t.value;autoGrow();refreshComposer()}
  if(t.id==='sin'){autoGrow()}
  if(t.id==='rf_fio'){RF.fio=t.value}
  if(t.id==='rf_name'){RF.name=t.value}
  if(t.id&&t.id.indexOf('rf_')===0){const b=document.getElementById('rfsend');if(b)b.disabled=!rfReady()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='btog'){BUILD.together=t.checked;rerender();return}
  if(t.id==='rf_dob'){RF.dob=t.value}
  if(t.id==='rf_inst'){RF.inst=t.value}
  if(t.id==='rf_ok'){RF.ok=t.checked}
  if(t.id&&t.id.indexOf('rf_')===0){const b=document.getElementById('rfsend');if(b)b.disabled=!rfReady()}
  if(t.id==='bdayin'&&t.value){const [y,m,d]=t.value.split('-');S.bday=S.bday||{};S.bday[S.me.pid]=d+'.'+m+'.'+y;save();toast('Напомним заранее');rerender();return}
  if(t.id==='blank'){S.replyBlank=t.checked;save();refreshComposer()}
  if(t.id==='phfile'){closeSheet();const files=[].slice.call(t.files||[]);let n=files.length;if(!n)return;if(location.hash.indexOf('/lk/chat')<0)go('/lk/chat');files.forEach(f=>{const r=new FileReader();r.onload=()=>{DRAFT.photos.push(r.result);if(--n===0){rerender();setTimeout(scrollBottom,30)}};r.readAsDataURL(f)})}
  if(t.id==='vfile'){const f=t.files&&t.files[0];if(!f)return;if(VID.url)URL.revokeObjectURL(VID.url);VID={url:URL.createObjectURL(f),sec:0};const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{VID.sec=v.duration||0;rerender()};v.src=VID.url;rerender()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cin'&&window.matchMedia('(pointer:fine)').matches){e.preventDefault();sendText()}});

route();
})();
</script>
</body>
